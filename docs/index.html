<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlant Global India</title>
    <meta
      name="description"
      content="Atlant Global India — courier, cargo and warehousing services in Bengaluru South and East."
    />
    <style>
      :root {
        --bg: #0b1220;
        --card: #111a2b;
        --text: #edf4ff;
        --muted: #b7c4d9;
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #132238, var(--bg) 55%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(720px, calc(100vw - 40px));
        background: rgba(17, 26, 43, 0.9);
        border: 1px solid rgba(125, 211, 252, 0.22);
        border-radius: 24px;
        padding: 48px 32px;
        box-shadow: 0 30px 80px rgba(7, 11, 20, 0.55);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(125, 211, 252, 0.18);
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 20px 0 14px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      .button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover { transform: translateY(-1px); }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #0b1220;
      }

      .secondary {
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.02);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">GitHub Pages</div>
      <h1>Atlant Global India</h1>
      <p>
        This GitHub Pages site is configured to serve a static landing page. To publish the full
        storefront, set GitHub Pages Source to <strong>Branch: main</strong> and
        <strong>Folder: /docs</strong> in the repository settings.
      </p>

      <div class="actions">
        <a class="button primary" href="https://github.com/mallikarjunkorwar26/AGI-WEB">Open repository</a>
        <a class="button secondary" href="https://github.com/mallikarjunkorwar26/AGI-WEB/actions">Check deployment</a>
      </div>
    </main>
  </body>
</html>
